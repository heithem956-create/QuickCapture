name: Build Debug APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile and Sign APK Directly
        run: |
          set -e
          echo "" | base64 -d > project.zip
          unzip -o project.zip

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          PLATFORM_JAR=$(find "$SDK_ROOT/platforms" -name "android.jar" | sort -V | tail -n 1)
          BUILD_TOOLS=$(dirname "$(find "$SDK_ROOT/build-tools" -name "aapt2" | sort -V | tail -n 1)")

          echo "Using PLATFORM_JAR: $PLATFORM_JAR"
          echo "Using BUILD_TOOLS:  $BUILD_TOOLS"

          mkdir -p build/classes app/build/outputs/apk/debug

          "$BUILD_TOOLS/aapt2" link -o build/unaligned.apk \
            --manifest app/src/main/AndroidManifest.xml \
            -I "$PLATFORM_JAR"

          javac -source 1.8 -target 1.8 \
            -classpath "$PLATFORM_JAR" \
            -d build/classes \
            app/src/main/java/com/example/quickcapture/*.java

          jar cf build/classes.jar -C build/classes .

          "$BUILD_TOOLS/d8" --lib "$PLATFORM_JAR" \
            --min-api 24 \
            --output build \
            build/classes.jar

          zip -uj build/unaligned.apk build/classes.dex

          "$BUILD_TOOLS/zipalign" -f -p 4 build/unaligned.apk build/aligned.apk

          keytool -genkeypair -v \
            -keystore build/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          "$BUILD_TOOLS/apksigner" sign \
            --ks build/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/debug/app-debug.apk \
            build/aligned.apk

          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickCapture-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
